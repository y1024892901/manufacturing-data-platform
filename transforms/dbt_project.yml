# ============================================================
# dbt 工程配置 —— 四层数仓建模与治理
# 运行：dbt run / dbt test / dbt docs generate
# ============================================================

name: 'mfg_warehouse'
version: '1.0.0'
config-version: 2

# 与 infra/configs/dbt_profiles.yml 中的 profile 名对应
profile: 'mfg_warehouse'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# ------------------------------------------------------------
# 分层物化策略：stg 视图（省存储），dwd/dws/ads 表（下游复用多）
# ------------------------------------------------------------
models:
  mfg_warehouse:
    staging:
      +schema: dwd
      +materialized: view
      +tags: ['staging']
    warehouse:
      +schema: dwd
      +materialized: table
      +tags: ['warehouse']
    marts:
      +schema: dws
      +materialized: table
      +tags: ['marts']
    metrics:
      +schema: dws
      +materialized: table
      +tags: ['metrics']

seeds:
  mfg_warehouse:
    +schema: dwd
    +quote_columns: false

snapshots:
  mfg_warehouse:
    +target_schema: dwd

# ------------------------------------------------------------
# 变量：阈值等业务参数集中在此，便于调整而无需改模型
# ------------------------------------------------------------
vars:
  # 日期维度生成范围
  date_dim_start: '2024-01-01'
  date_dim_end:   '2027-12-31'
  # 延期标签宽限天数（models/features/labels.py 需与此保持一致）
  delay_tolerance_days: 1
  # 风险等级阈值（probability）
  risk_level_high: 0.70
  risk_level_medium: 0.40
  # 特征缺失率上限，超过则训练报错
  feature_null_rate_max: 0.30
